name: Vercel Remote Trigger
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Webhook
        env:
          # This line maps your secret to an environment variable
          MY_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$MY_URL" ]; then
            echo "ERROR: The secret is empty. Check your GitHub Settings."
            exit 1
          fi
          curl -X POST "$MY_URL"
